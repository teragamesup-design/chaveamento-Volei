
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Enigma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: #000;
      color: #39ff14;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .oculto {
      display: none !important;
    }

    #foto {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      background: #050505;
      color: #39ff14;
      border: 1px solid #228b22;
      border-radius: 8px;
      font-family: monospace;
      font-size: 16px;
    }

    button {
      cursor: pointer;
      font-family: monospace;
    }

    .confirmar {
      width: 100%;
      padding: 14px;
      color: #39ff14;
      background: #102010;
      border: 1px solid #39ff14;
      border-radius: 8px;
    }

    #morse {
      position: fixed;
      z-index: 10;
      max-width: 90vw;
      padding: 9px;
      color: #39ff14;
      background: #000;
      border: 1px solid #174b17;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    /* ENIGMA DAS CORES */

    #palavra {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      letter-spacing: 5px;
      color: #fff;
      overflow-wrap: anywhere;
    }

    #botoesCores {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 25px;
    }

    .cor {
      min-height: 75px;
      border: 2px solid #555;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .azul {
      background: #0000ff;
      color: white;
    }

    .vermelho {
      background: #ff0000;
      color: white;
    }

    .amarelo {
      background: #ffff00;
      color: black;
    }

    .verde {
      background: #008000;
      color: white;
    }

    .branco {
      background: #ffffff;
      color: black;
    }

    /* CORES DA TRANSIÇÃO */

    body.cor-rosa {
      background: #f5a9c8;
    }

    body.cor-laranja {
      background: #e9742b;
    }

    body.cor-azul {
      background: #0000ff;
    }

    /* MENSAGEM FINAL */

    #mensagem {
      color: #39ff14;
      font-size: 16px;
      line-height: 1.9;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: center;
      direction: rtl;
    }

    body.encerrado {
      background: #000 !important;
    }

    body.encerrado #app {
      display: none;
    }
  </style>
</head>

<body>
  <main id="app">

    <!-- TELA 1 -->
    <section id="tela1">
      <img id="foto" src="foto1.png" alt="">

      <form id="form1">
        <input id="resposta1"
               placeholder="Digite sua resposta..."
               autocomplete="off"
               autocapitalize="off"
               required>

        <button class="confirmar" type="submit">
          CONFIRMAR
        </button>
      </form>
    </section>

    <!-- CÓDIGO MORSE -->
    <div id="morse" class="oculto">
      -. --- / --- .-.. .... . / -- .. -. .... .- / -... .. ---
    </div>

    <!-- TELA 2 -->
    <section id="tela2" class="oculto">
      <form id="form2">
        <input id="resposta2"
               placeholder="..."
               autocomplete="off"
               autocapitalize="off"
               required>

        <button class="confirmar" type="submit">
          CONFIRMAR
        </button>
      </form>
    </section>

    <!-- TELA 3: ENIGMA DAS CORES -->
    <section id="telaCores" class="oculto">

      <div id="palavra"></div>

      <div id="botoesCores" class="oculto">

        <button class="cor azul"
                data-cor="azul">AZUL</button>

        <button class="cor vermelho"
                data-cor="vermelho">VERMELHO</button>

        <button class="cor amarelo"
                data-cor="amarelo">AMARELO</button>

        <button class="cor verde"
                data-cor="verde">VERDE</button>

        <button class="cor branco"
                data-cor="branco">BRANCO</button>

      </div>
    </section>

    <!-- MENSAGEM FINAL -->
    <section id="telaFinal" class="oculto">
      <div id="mensagem" lang="he" dir="rtl"></div>
    </section>

  </main>

  <script>
    const $ = id => document.getElementById(id);

    const tela1 = $("tela1");
    const tela2 = $("tela2");
    const telaCores = $("telaCores");
    const telaFinal = $("telaFinal");

    const morse = $("morse");
    const palavra = $("palavra");
    const botoesCores = $("botoesCores");
    const mensagem = $("mensagem");

    let encerrado = false;
    let etapaCores = 0;

    const combinacao = [
      "amarelo",
      "branco",
      "verde",
      "verde"
    ];

    function encerrar() {
      if (encerrado) return;

      encerrado = true;
      document.body.className = "encerrado";
      $("app").style.display = "none";
      morse.classList.add("oculto");
    }

    // MORSE: aparece uma vez por carregamento.
    const atrasoMorse = Math.random() * 10000;
    const duracaoMorse = 5000 + Math.random() * 5000;

    setTimeout(() => {
      if (encerrado ||
          tela1.classList.contains("oculto")) {
        return;
      }

      morse.style.left =
        Math.random() * Math.max(
          0, window.innerWidth - 300
        ) + "px";

      morse.style.top =
        Math.random() * Math.max(
          0, window.innerHeight - 100
        ) + "px";

      morse.classList.remove("oculto");

      setTimeout(() => {
        morse.classList.add("oculto");
      }, duracaoMorse);

    }, atrasoMorse);


    // PRIMEIRO ENIGMA: KAE'EV
    $("form1").addEventListener("submit", event => {
      event.preventDefault();

      const resposta =
        $("resposta1").value.trim().toLowerCase();

      if (resposta !== "kae'ev") {
        $("resposta1").value = "";
        $("resposta1").placeholder = "Resposta incorreta.";
        return;
      }

      morse.classList.add("oculto");
      tela1.classList.add("oculto");

      document.body.className = "cor-rosa";

      setTimeout(() => {
        if (!encerrado) {
          document.body.className = "cor-laranja";
        }
      }, 1000);

      setTimeout(() => {
        if (!encerrado) {
          document.body.className = "cor-azul";
        }
      }, 2000);

      setTimeout(() => {
        if (encerrado) return;

        document.body.className = "";
        tela2.classList.remove("oculto");
        $("resposta2").focus();
      }, 3000);
    });


    // SEGUNDO ENIGMA: IZA
    $("form2").addEventListener("submit", event => {
      event.preventDefault();

      const resposta =
        $("resposta2").value.trim().toUpperCase();

      if (resposta !== "IZA") {
        encerrar();
        return;
      }

      tela2.classList.add("oculto");
      telaCores.classList.remove("oculto");

      iniciarSequencia();
    });


    // SEQUÊNCIA DE PALAVRAS
    function iniciarSequencia() {
      etapaCores = 0;

      botoesCores.classList.add("oculto");
      palavra.classList.remove("oculto");

      document.body.className = "";
      palavra.textContent = "";

      // Cada palavra dura 500 milissegundos.
      setTimeout(() => {
        if (encerrado) return;
        palavra.textContent = "tzahov";
      }, 100);

      setTimeout(() => {
        if (encerrado) return;
        palavra.textContent = "levan";
      }, 600);

      setTimeout(() => {
        if (encerrado) return;
        palavra.textContent = "yarok";
      }, 1100);

      // Pequeno apagão preto entre os dois "yarok".
      setTimeout(() => {
        if (encerrado) return;
        palavra.textContent = "";
        document.body.style.background = "#000";
      }, 1600);

      setTimeout(() => {
        if (encerrado) return;
        palavra.textContent = "yarok";
      }, 1850);

      // Os botões só aparecem depois das palavras.
      setTimeout(() => {
        if (encerrado) return;

        palavra.classList.add("oculto");
        botoesCores.classList.remove("oculto");
      }, 2350);
    }


    // TERCEIRO ENIGMA: SEQUÊNCIA DE CORES
    botoesCores.addEventListener("click", event => {
      const botao = event.target.closest("button[data-cor]");

      if (!botao || encerrado) return;

      const corEscolhida = botao.dataset.cor;

      if (corEscolhida === combinacao[etapaCores]) {
        etapaCores++;

        // Quatro respostas corretas: revelar mensagem.
        if (etapaCores === combinacao.length) {
          mostrarMensagemFinal();
        }

      } else {
        // Errou: reinicia a sequência de palavras.
        iniciarSequencia();
      }
    });


    // REVELAÇÃO DA MENSAGEM FINAL
    function mostrarMensagemFinal() {
      telaCores.classList.add("oculto");
      telaFinal.classList.remove("oculto");

      mensagem.textContent =
        "האמת, אף פעם לא רציתי שתדעי. " +
        "לראות אותך היה נפלא, אבל למה אני מרגישה כל כך הרבה כאב? " +
        "אני כל כך מצטערת על זה. רציתי לפגוש אותך שוב... " +
        "לראות את השיער שלך ולהיות איתך. " +
        "מה שאני מרגישה הכי הרבה זה את הכאב של לראות אותך " +
        "ואפילו לא להיות מסוגלת לדבר. " +
        "אהבתי אותך, אני לא רוצה יותר אף אחד אחר, אפילו ויתרתי.";

      setTimeout(() => {
        encerrar();
      }, 10000);
    }
  </script>
</body>
</html>
