
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#000000">
  <title>Enigma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #000;
      color: #39ff14;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #app {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    #foto {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 28px;
    }

    input {
      display: block;
      width: 100%;
      background: #050505;
      color: #39ff14;
      border: 1px solid #228b22;
      border-radius: 8px;
      padding: 15px;
      outline: none;
      font-family: monospace;
      font-size: 16px;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #39ff14;
    }

    button {
      width: 100%;
      background: #102010;
      color: #39ff14;
      border: 1px solid #39ff14;
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 15px;
      cursor: pointer;
    }

    button:active {
      background: #204020;
    }

    #morse {
      position: fixed;
      z-index: 10;
      max-width: 90vw;
      color: #39ff14;
      background: #000;
      border: 1px solid #174b17;
      padding: 9px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #mensagem {
      color: #39ff14;
      font-family: monospace;
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      direction: rtl;
      text-align: center;
    }

    .encerrado {
      background: #000 !important;
      color: #000 !important;
    }

    .encerrado #app {
      display: none;
    }

    .oculto {
      display: none !important;
    }

    /* As cores são sólidas, sem animação. */
    body.cor-rosa {
      background: #F5A9C8;
    }

    body.cor-laranja {
      background: #E9742B;
    }

    body.cor-azul {
      background: #0000FF;
    }
  </style>
</head>

<body>
  <main id="app">

    <!-- PRIMEIRA TELA -->
    <section id="tela1">
      <img id="foto" src="foto1.png" alt="">

      <form id="form1">
        <input
          id="resposta1"
          type="text"
          placeholder="Digite sua resposta..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
        >

        <button type="submit">CONFIRMAR</button>
      </form>
    </section>

    <!-- MENSAGEM EM MORSE -->
    <div id="morse" class="oculto">
      -. --- / --- .-.. .... . / -- .. -. .... .- / -... .. ---
    </div>

    <!-- SEGUNDA TELA -->
    <section id="tela2" class="oculto">
      <form id="form2">
        <input
          id="resposta2"
          type="text"
          placeholder="..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
        >

        <button type="submit">CONFIRMAR</button>
      </form>
    </section>

    <!-- MENSAGEM FINAL -->
    <section id="telaFinal" class="oculto">
      <div id="mensagem" lang="he" dir="rtl"></div>
    </section>

  </main>

  <script>
    const tela1 = document.getElementById("tela1");
    const tela2 = document.getElementById("tela2");
    const telaFinal = document.getElementById("telaFinal");

    const form1 = document.getElementById("form1");
    const form2 = document.getElementById("form2");

    const resposta1 = document.getElementById("resposta1");
    const resposta2 = document.getElementById("resposta2");

    const morse = document.getElementById("morse");
    const mensagem = document.getElementById("mensagem");

    let encerrado = false;

    // Faz a tela ficar preta ao encerrar.
    function encerrar() {
      if (encerrado) return;

      encerrado = true;
      document.body.className = "encerrado";
      document.getElementById("app").style.display = "none";
      morse.classList.add("oculto");
    }

    // MORSE: aparece nos primeiros 10 segundos.
    // Permanece visível por 5 a 10 segundos.
    // Não reaparece sem recarregar a página.
    const atrasoMorse = Math.random() * 10000;
    const duracaoMorse = 5000 + Math.random() * 5000;

    setTimeout(() => {
      if (encerrado || tela1.classList.contains("oculto")) {
        return;
      }

      // Posição aleatória, mantendo a mensagem na tela.
      morse.style.left =
        Math.random() * Math.max(
          0, window.innerWidth - 300
        ) + "px";

      morse.style.top =
        Math.random() * Math.max(
          0, window.innerHeight - 100
        ) + "px";

      morse.classList.remove("oculto");

      setTimeout(() => {
        morse.classList.add("oculto");
      }, duracaoMorse);

    }, atrasoMorse);


    // PRIMEIRA RESPOSTA: KAE'EV
    form1.addEventListener("submit", function(event) {
      event.preventDefault();

      const resposta = resposta1.value.trim().toLowerCase();

      if (resposta !== "kae'ev") {
        resposta1.value = "";
        resposta1.placeholder = "Resposta incorreta.";
        return;
      }

      morse.classList.add("oculto");
      tela1.classList.add("oculto");

      // Cores em intervalos de um segundo.
      document.body.className = "cor-rosa";

      setTimeout(() => {
        if (encerrado) return;
        document.body.className = "cor-laranja";
      }, 1000);

      setTimeout(() => {
        if (encerrado) return;
        document.body.className = "cor-azul";
      }, 2000);

      setTimeout(() => {
        if (encerrado) return;

        document.body.className = "";
        tela2.classList.remove("oculto");
        resposta2.focus();
      }, 3000);
    });


    // SEGUNDA RESPOSTA: IZA
    form2.addEventListener("submit", function(event) {
      event.preventDefault();

      const resposta = resposta2.value.trim().toUpperCase();

      if (resposta !== "IZA") {
        encerrar();
        return;
      }

      tela2.classList.add("oculto");
      telaFinal.classList.remove("oculto");

      mensagem.textContent =
        "האמת, אף פעם לא רציתי שתדעי. " +
        "לראות אותך היה נפלא, אבל למה אני מרגישה כל כך הרבה כאב? " +
        "אני כל כך מצטערת על זה. רציתי לפגוש אותך שוב... " +
        "לראות את השיער שלך ולהיות איתך. " +
        "מה שאני מרגישה הכי הרבה זה את הכאב של לראות אותך " +
        "ואפילו לא להיות מסוגלת לדבר. " +
        "אהבתי אותך, אני לא רוצה יותר אף אחד אחר, אפילו ויתרתי.";

      // Depois de 10 segundos, encerra a experiência.
      setTimeout(() => {
        encerrar();
      }, 10000);
    });
  </script>
</body>
</html>
